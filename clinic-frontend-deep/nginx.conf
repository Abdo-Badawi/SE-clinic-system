server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # All unknown paths return index.html so react-router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Optional: proxy /api requests to the backend ─────────────────────────
    # Uncomment this block if you want nginx to forward API calls instead of
    # having the browser hit the backend directly.
    #
    # location /api/ {
    #     proxy_pass         http://backend:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;
}
